name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npx mocha --ui tdd out/test/unit/**/*.test.js
      - name: Package
        run: npx vsce package --no-yarn
      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx vsce publish --yarn -p ${{ secrets.VSCE_PAT }}
      - name: Publish to OpenVSX
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx ovsx publish --pat ${{ secrets.OVSX_PAT }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
