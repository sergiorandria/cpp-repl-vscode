name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / Test (Node ${{ matrix.node }} / OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20.x, 22.x]
        include:
          - os: ubuntu-latest
            node: 20.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npx mocha --ui tdd out/test/unit/**/*.test.js

      - name: Grammar validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('syntaxes/cpp-repl.tmLanguage.json','utf8')); JSON.parse(require('fs').readFileSync('syntaxes/cpp-repl-session.tmLanguage.json','utf8')); console.log('grammar JSON OK')"
          node -e "JSON.parse(require('fs').readFileSync('language-configuration.json','utf8')); console.log('language-configuration JSON OK')"

      - name: Package VSIX
        run: npx vsce package --no-yarn --out cpp-repl.vsix

      - name: Verify VSIX contents
        run: |
          npx vsce ls --yarn || true
          unzip -l cpp-repl.vsix | head -n 50

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.node }}
          path: cpp-repl.vsix

  vscode-test:
    name: VS Code Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Run VS Code tests (xvfb)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
